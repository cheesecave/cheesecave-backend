# Optional sibling source builds: docker compose -f compose.yml -f compose.build.yml up -d --build
services:
  hub-api:
    image: ${CHEESECAVE_BACKEND_IMAGE:-cheesecave-backend:local}
    build:
      context: .
      args:
        KOHAKU_HUB_GIT_SHA: ${KOHAKU_HUB_GIT_SHA:-}
        KOHAKU_HUB_BUILD_TIME: ${KOHAKU_HUB_BUILD_TIME:-}
  khub-worker:
    image: ${CHEESECAVE_BACKEND_IMAGE:-cheesecave-backend:local}
    build:
      context: .
      args:
        KOHAKU_HUB_GIT_SHA: ${KOHAKU_HUB_GIT_SHA:-}
        KOHAKU_HUB_BUILD_TIME: ${KOHAKU_HUB_BUILD_TIME:-}
  hub-web:
    image: ${CHEESECAVE_WEB_IMAGE:-cheesecave-web:local}
    build:
      context: ../cheesecave-web
      args:
        VITE_GIT_COMMIT: ${CHEESECAVE_WEB_GIT_SHA:-}
        VITE_GIT_DIRTY: ${CHEESECAVE_WEB_GIT_DIRTY:-false}
  hub-admin:
    image: ${CHEESECAVE_ADMIN_IMAGE:-cheesecave-admin:local}
    build:
      context: ../cheesecave-admin
      args:
        VITE_GIT_COMMIT: ${CHEESECAVE_ADMIN_GIT_SHA:-}
        VITE_GIT_DIRTY: ${CHEESECAVE_ADMIN_GIT_DIRTY:-false}
