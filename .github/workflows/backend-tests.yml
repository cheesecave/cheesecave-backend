name: Backend tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"  # the daily run adds the cells scripts/ci/matrix.py keeps off pull requests
  # Only code, tests, build and deployment configuration start this workflow.
  # Documentation, images and other resources do not.
  pull_request:
    paths:
          - "src/**"
          - "!src/**/*.md"
          - "test/**"
          - "scripts/**"
          - "docker/**"
          - "compose*.yml"
          - "docker-compose.example.yml"
          - ".env.compose.example"
          - "pyproject.toml"
          - "pytest.ini"
          - ".coveragerc"
          - "Makefile"
          - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
          - "src/**"
          - "!src/**/*.md"
          - "test/**"
          - "scripts/**"
          - "docker/**"
          - "compose*.yml"
          - "docker-compose.example.yml"
          - ".env.compose.example"
          - "pyproject.toml"
          - "pytest.ini"
          - ".coveragerc"
          - "Makefile"
          - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan the test cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      main: ${{ steps.plan.outputs.main }}
      cache: ${{ steps.plan.outputs.cache }}
      s3: ${{ steps.plan.outputs.s3 }}
      sqlite: ${{ steps.plan.outputs.sqlite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        run: python3 -m scripts.ci.matrix "${{ github.event_name }}"

  backend-tests:
    name: >-
      backend unit tests (${{ matrix.python-version }}, ${{ matrix.huggingface-hub-version }}${{
      matrix.subset == 'hf' && ', client only' || '' }}${{ matrix.shard && format(', slice {0}', matrix.shard) || '' }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45  # a slice of the suite takes about 15 minutes; the whole suite took 45 to 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.main) }}
    env:
      KOHAKU_HUB_DB_BACKEND: postgres
      KOHAKU_HUB_DATABASE_URL: postgresql://hub_test:hub_test_password@127.0.0.1:25432/kohakuhub_test
      KOHAKU_HUB_S3_ENDPOINT: http://127.0.0.1:29001
      KOHAKU_HUB_S3_PUBLIC_ENDPOINT: http://127.0.0.1:29001
      KOHAKU_HUB_S3_ACCESS_KEY: minioadmin
      KOHAKU_HUB_S3_SECRET_KEY: minioadmin
      KOHAKU_HUB_S3_BUCKET: hub-storage
      KOHAKU_HUB_S3_REGION: us-east-1
      KOHAKU_HUB_LAKEFS_ENDPOINT: http://127.0.0.1:28000
      KOHAKU_HUB_LAKEFS_REPO_NAMESPACE: hf
      KOHAKU_HUB_LAKEFS_CREDENTIALS_FILE: ${{ github.workspace }}/hub-meta/test/backend-service/lakefs-credentials.env
      HUGGINGFACE_HUB_VERSION: ${{ matrix.huggingface-hub-version }}
      # Run the matrix with the L2 cache enabled to exercise the read-through
      # path on every Python × huggingface_hub combination. The cache-OFF
      # silent-degradation contract is covered by the dedicated
      # ``backend-tests-cache-disabled`` job below — splitting it out keeps
      # the main matrix size from doubling.
      KOHAKU_HUB_CACHE_ENABLED: "true"
      KOHAKU_HUB_CACHE_URL: redis://127.0.0.1:26379/0
      # Cache tests in test_cache.py read this to find the Valkey instance.
      KOHAKU_HUB_CACHE_TEST_URL: redis://127.0.0.1:26379/0
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: hub_test_password
          POSTGRES_DB: kohakuhub_test
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U hub_test -d kohakuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        # quay.io/minio/minio no longer serves anonymous pulls; use the
        # community-maintained build of the same server.
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 29001:9000
          - 29000:29000
        command: server /data --console-address ":29000"
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      lakefs:
        image: treeverse/lakefs:1.86.0 # the bundled release (docs/deployment/lakefs.md)
        env:
          LAKEFS_DATABASE_TYPE: local
          LAKEFS_DATABASE_LOCAL_PATH: /tmp/lakefs/metadata.db
          LAKEFS_BLOCKSTORE_TYPE: s3
          LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
          LAKEFS_BLOCKSTORE_S3_BUCKET: hub-storage
          LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minioadmin
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minioadmin
          LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
          LAKEFS_AUTH_ENCRYPT_SECRET_KEY: 0123456789abcdef0123456789abcdef
          LAKEFS_LOGGING_FORMAT: text
          LAKEFS_LISTEN_ADDRESS: 0.0.0.0:8000
          # LakeFS keeps a deleted repository readable for 5 s (its repository cache), and the
          # test fixture waits for the 404 on every restore: 6 s of the 9 s. 100 ms removes it.
          LAKEFS_GRAVELER_REPOSITORY_CACHE_EXPIRY: 100ms
          LAKEFS_GRAVELER_REPOSITORY_CACHE_JITTER: 0s
        ports:
          - 28000:8000
        options: >-
          --health-cmd "wget --spider --quiet http://127.0.0.1:8000/_health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        # CI is fresh per job — no need for RDB persistence here; the
        # production / dev defaults that turn it on are covered by the
        # docker-compose example and up_infra.sh respectively.
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 26379:6379

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          if [ "${HUGGINGFACE_HUB_VERSION}" = "latest" ]; then
            python -m pip install --upgrade huggingface_hub
          else
            python -m pip install --upgrade "huggingface_hub==${HUGGINGFACE_HUB_VERSION}"
          fi

      - name: Run backend tests with coverage
        env:
          SHARD: ${{ matrix.shard }}
          SUBSET: ${{ matrix.subset }}
          COVERAGE_FILE: .coverage.${{ github.job }}.${{ strategy.job-index }}
        run: |
          # PYTEST_ADDOPTS carries the slice and the marker into the Makefile's pytest line;
          # the coverage gate runs once over every slice (backend-gate), not in each job.
          opts=""
          [ -n "$SHARD" ] && opts="$opts -p scripts.ci.shard --shard $SHARD"
          [ "$SUBSET" = hf ] && opts="$opts -m hf_client"
          PYTEST_ADDOPTS="$opts" make test-backend COV_FAIL_UNDER=0 COV_TYPES=term-missing

      - name: Keep the coverage data for the gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-data-${{ github.job }}-${{ strategy.job-index }}
          path: .coverage.*
          include-hidden-files: true

  backend-tests-cache-disabled:
    needs: plan
    # The "cache must never be on the correctness critical path" contract
    # has its own dedicated job: a single Python / huggingface_hub combo
    # with KOHAKU_HUB_CACHE_ENABLED=false. If the suite ever takes a hard
    # dependency on cache state (e.g. a missing write-through invalidate
    # makes a test pass only because cache hides the bug), this job goes
    # red. Splitting it out instead of doubling the main matrix saves
    # ~18 GitHub Actions minutes per push.
    #
    # It also runs on the oldest LakeFS release KohakuHub supports, so that
    # claim stays true (docs/deployment/lakefs.md, kohakuhub.lakefs_compat).
    name: backend tests (cache disabled, LakeFS ${{ matrix.lakefs }}, slice ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cache) }}  # 1.48.1, the oldest supported, on every PR; the bundled 1.86.0 daily
    env:
      KOHAKU_HUB_DB_BACKEND: postgres
      KOHAKU_HUB_DATABASE_URL: postgresql://hub_test:hub_test_password@127.0.0.1:25432/kohakuhub_test
      KOHAKU_HUB_S3_ENDPOINT: http://127.0.0.1:29001
      KOHAKU_HUB_S3_PUBLIC_ENDPOINT: http://127.0.0.1:29001
      KOHAKU_HUB_S3_ACCESS_KEY: minioadmin
      KOHAKU_HUB_S3_SECRET_KEY: minioadmin
      KOHAKU_HUB_S3_BUCKET: hub-storage
      KOHAKU_HUB_S3_REGION: us-east-1
      KOHAKU_HUB_LAKEFS_ENDPOINT: http://127.0.0.1:28000
      KOHAKU_HUB_LAKEFS_REPO_NAMESPACE: hf
      KOHAKU_HUB_LAKEFS_CREDENTIALS_FILE: ${{ github.workspace }}/hub-meta/test/backend-service/lakefs-credentials.env
      # Cache is OFF for this job. The cache module's own tests still run
      # against the Valkey service via KOHAKU_HUB_CACHE_TEST_URL — they
      # validate the cache layer itself, not the rest of the suite.
      KOHAKU_HUB_CACHE_ENABLED: "false"
      KOHAKU_HUB_CACHE_TEST_URL: redis://127.0.0.1:26379/0
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: hub_test_password
          POSTGRES_DB: kohakuhub_test
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U hub_test -d kohakuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        # quay.io/minio/minio no longer serves anonymous pulls; use the
        # community-maintained build of the same server.
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 29001:9000
          - 29000:29000
        command: server /data --console-address ":29000"
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      lakefs:
        image: treeverse/lakefs:${{ matrix.lakefs }}
        env:
          LAKEFS_DATABASE_TYPE: local
          LAKEFS_DATABASE_LOCAL_PATH: /tmp/lakefs/metadata.db
          LAKEFS_BLOCKSTORE_TYPE: s3
          LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
          LAKEFS_BLOCKSTORE_S3_BUCKET: hub-storage
          LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minioadmin
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minioadmin
          LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
          LAKEFS_AUTH_ENCRYPT_SECRET_KEY: 0123456789abcdef0123456789abcdef
          LAKEFS_LOGGING_FORMAT: text
          LAKEFS_LISTEN_ADDRESS: 0.0.0.0:8000
          # LakeFS keeps a deleted repository readable for 5 s (its repository cache), and the
          # test fixture waits for the 404 on every restore: 6 s of the 9 s. 100 ms removes it.
          LAKEFS_GRAVELER_REPOSITORY_CACHE_EXPIRY: 100ms
          LAKEFS_GRAVELER_REPOSITORY_CACHE_JITTER: 0s
        ports:
          - 28000:8000
        options: >-
          --health-cmd "wget --spider --quiet http://127.0.0.1:8000/_health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      valkey:
        # Still need a reachable Valkey for the cache-module tests
        # (they assert the helper's contract; that contract stands or
        # falls regardless of whether the rest of the API uses the cache).
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 26379:6379

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade huggingface_hub

      - name: Run backend tests with cache disabled
        env:
          SHARD: ${{ matrix.shard }}
          SUBSET: ${{ matrix.subset }}
          COVERAGE_FILE: .coverage.${{ github.job }}.${{ strategy.job-index }}
        run: |
          # PYTEST_ADDOPTS carries the slice and the marker into the Makefile's pytest line;
          # the coverage gate runs once over every slice (backend-gate), not in each job.
          opts=""
          [ -n "$SHARD" ] && opts="$opts -p scripts.ci.shard --shard $SHARD"
          [ "$SUBSET" = hf ] && opts="$opts -m hf_client"
          PYTEST_ADDOPTS="$opts" make test-backend COV_FAIL_UNDER=0 COV_TYPES=term-missing

      - name: Keep the coverage data for the gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-data-${{ github.job }}-${{ strategy.job-index }}
          path: .coverage.*
          include-hidden-files: true

  backend-tests-s3-endpoint-path:
    needs: plan
    # Production's layout (#133): the real bucket sits in the S3 endpoint's
    # path, KohakuHub's bucket is a key prefix inside it, and the one key
    # (shared with LakeFS) may only touch that bucket, as an R2 API token
    # scoped to one bucket. The whole suite runs this way, plus the tests in
    # test_s3_bucket_in_endpoint_stack.py, which check what is really stored.
    name: backend tests (S3 endpoint with a path, slice ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s3) }}
    env:
      KOHAKU_HUB_DB_BACKEND: postgres
      KOHAKU_HUB_DATABASE_URL: postgresql://hub_test:hub_test_password@127.0.0.1:25432/kohakuhub_test
      KOHAKU_HUB_S3_ENDPOINT: http://127.0.0.1:29001/realbucket
      KOHAKU_HUB_S3_PUBLIC_ENDPOINT: http://127.0.0.1:29001/realbucket
      KOHAKU_HUB_S3_ACCESS_KEY: hubuser
      KOHAKU_HUB_S3_SECRET_KEY: hubpass123
      KOHAKU_HUB_S3_BUCKET: hub-storage
      KOHAKU_HUB_S3_REGION: us-east-1
      KOHAKU_HUB_LAKEFS_ENDPOINT: http://127.0.0.1:28000
      KOHAKU_HUB_LAKEFS_REPO_NAMESPACE: hf
      KOHAKU_HUB_LAKEFS_CREDENTIALS_FILE: ${{ github.workspace }}/hub-meta/test/backend-service/lakefs-credentials.env
      KOHAKU_HUB_CACHE_ENABLED: "false"
      KOHAKU_HUB_CACHE_TEST_URL: redis://127.0.0.1:26379/0
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hub_test
          POSTGRES_PASSWORD: hub_test_password
          POSTGRES_DB: kohakuhub_test
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U hub_test -d kohakuhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 29001:9000
        command: server /data
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      lakefs:
        image: treeverse/lakefs:1.86.0
        env:
          LAKEFS_DATABASE_TYPE: local
          LAKEFS_DATABASE_LOCAL_PATH: /tmp/lakefs/metadata.db
          LAKEFS_BLOCKSTORE_TYPE: s3
          # The same endpoint as KohakuHub's: it checks no key at startup, so
          # the user created below is in place before it is first used
          LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000/realbucket
          LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: hubuser
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: hubpass123
          LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
          LAKEFS_AUTH_ENCRYPT_SECRET_KEY: 0123456789abcdef0123456789abcdef
          LAKEFS_LOGGING_FORMAT: text
          LAKEFS_LISTEN_ADDRESS: 0.0.0.0:8000
          # LakeFS keeps a deleted repository readable for 5 s (its repository cache), and the
          # test fixture waits for the 404 on every restore: 6 s of the 9 s. 100 ms removes it.
          LAKEFS_GRAVELER_REPOSITORY_CACHE_EXPIRY: 100ms
          LAKEFS_GRAVELER_REPOSITORY_CACHE_JITTER: 0s
        ports:
          - 28000:8000
        options: >-
          --health-cmd "wget --spider --quiet http://127.0.0.1:8000/_health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 26379:6379

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create the real bucket and a key scoped to it
        # S3 on realbucket only; server info too, so that the health probe
        # looking up the MinIO release (asked at the root) is checked live.
        # The script is single-quoted: keep apostrophes out of it.
        run: |
          docker exec "${{ job.services.minio.id }}" sh -c '
            set -e
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
            mc mb local/realbucket
            printf "%s" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::realbucket\",\"arn:aws:s3:::realbucket/*\"]},{\"Effect\":\"Allow\",\"Action\":[\"admin:ServerInfo\"]}]}" > /tmp/realbucket-only.json
            mc admin user add local hubuser hubpass123
            mc admin policy create local realbucket-only /tmp/realbucket-only.json
            mc admin policy attach local realbucket-only --user hubuser
          '

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade huggingface_hub

      - name: Run backend tests against an endpoint with a path
        env:
          SHARD: ${{ matrix.shard }}
          SUBSET: ${{ matrix.subset }}
          COVERAGE_FILE: .coverage.${{ github.job }}.${{ strategy.job-index }}
        run: |
          # PYTEST_ADDOPTS carries the slice and the marker into the Makefile's pytest line;
          # the coverage gate runs once over every slice (backend-gate), not in each job.
          opts=""
          [ -n "$SHARD" ] && opts="$opts -p scripts.ci.shard --shard $SHARD"
          [ "$SUBSET" = hf ] && opts="$opts -m hf_client"
          PYTEST_ADDOPTS="$opts" make test-backend COV_FAIL_UNDER=0 COV_TYPES=term-missing

      - name: Keep the coverage data for the gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-data-${{ github.job }}-${{ strategy.job-index }}
          path: .coverage.*
          include-hidden-files: true

  backend-tests-sqlite:
    needs: plan
    # The full suite on the SQLite backend, with the same MinIO, LakeFS and Valkey
    # services as the PostgreSQL jobs but no PostgreSQL service: a green run proves
    # the suite has no Postgres dependency, and that SQLite behaves the same on
    # every test, not only the unit tests that need no services.
    name: backend tests (sqlite, Python ${{ matrix.python-version }}, slice ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sqlite) }}
    env:
      KOHAKU_HUB_DB_BACKEND: sqlite
      # A file, not ":memory:": the live-server tests reach the database from another thread.
      KOHAKU_HUB_S3_ENDPOINT: http://127.0.0.1:29001
      KOHAKU_HUB_S3_PUBLIC_ENDPOINT: http://127.0.0.1:29001
      KOHAKU_HUB_S3_ACCESS_KEY: minioadmin
      KOHAKU_HUB_S3_SECRET_KEY: minioadmin
      KOHAKU_HUB_S3_BUCKET: hub-storage
      KOHAKU_HUB_S3_REGION: us-east-1
      KOHAKU_HUB_LAKEFS_ENDPOINT: http://127.0.0.1:28000
      KOHAKU_HUB_LAKEFS_REPO_NAMESPACE: hf
      KOHAKU_HUB_LAKEFS_CREDENTIALS_FILE: ${{ github.workspace }}/hub-meta/test/backend-service/lakefs-credentials.env
      KOHAKU_HUB_CACHE_ENABLED: "true"
      KOHAKU_HUB_CACHE_URL: redis://127.0.0.1:26379/0
      KOHAKU_HUB_CACHE_TEST_URL: redis://127.0.0.1:26379/0
    services:
      minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 29001:9000
          - 29000:29000
        command: server /data --console-address ":29000"
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      lakefs:
        image: treeverse/lakefs:1.86.0 # the bundled release (docs/deployment/lakefs.md)
        env:
          LAKEFS_DATABASE_TYPE: local
          LAKEFS_DATABASE_LOCAL_PATH: /tmp/lakefs/metadata.db
          LAKEFS_BLOCKSTORE_TYPE: s3
          LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
          LAKEFS_BLOCKSTORE_S3_BUCKET: hub-storage
          LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minioadmin
          LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minioadmin
          LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
          LAKEFS_AUTH_ENCRYPT_SECRET_KEY: 0123456789abcdef0123456789abcdef
          LAKEFS_LOGGING_FORMAT: text
          LAKEFS_LISTEN_ADDRESS: 0.0.0.0:8000
          # LakeFS keeps a deleted repository readable for 5 s (its repository cache), and the
          # test fixture waits for the 404 on every restore: 6 s of the 9 s. 100 ms removes it.
          LAKEFS_GRAVELER_REPOSITORY_CACHE_EXPIRY: 100ms
          LAKEFS_GRAVELER_REPOSITORY_CACHE_JITTER: 0s
        ports:
          - 28000:8000
        options: >-
          --health-cmd "wget --spider --quiet http://127.0.0.1:8000/_health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 26379:6379

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade huggingface_hub

      - name: Point the test database at a file in the runner temp directory
        run: echo "KOHAKU_HUB_DATABASE_URL=sqlite:///${RUNNER_TEMP}/kohakuhub-test.db" >> "$GITHUB_ENV"

      - name: Run the backend suite on SQLite
        run: |
          python -m pytest test/kohakuhub -q -p no:cacheprovider -p scripts.ci.shard --shard "${{ matrix.shard }}"

  backend-gate:
    # One place that says whether the backend suite is green, and the only place that judges
    # coverage: the slices and cells each ran part of the suite, so the numbers add up here.
    name: backend tests gate
    needs: [plan, backend-tests, backend-tests-cache-disabled, backend-tests-s3-endpoint-path, backend-tests-sqlite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Add up the coverage of every slice and cell
        env:
          PYTHONPATH: src
        run: |
          python -m pip install coverage
          coverage combine
          coverage report --fail-under=80 --skip-covered
          coverage xml -o coverage.xml

      - name: Upload the combined backend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: backend
          name: backend-tests
          fail_ci_if_error: false
          verbose: true

      - name: Every test job must have passed
        if: ${{ always() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          bad = {k: v["result"] for k, v in json.loads(os.environ["NEEDS"]).items() if v["result"] != "success"}
          print(bad or "all green")
          sys.exit(1 if bad else 0)
          PY
