name: Forward-looking huggingface_hub compatibility

# Runs only the tests marked `hf_client` against the latest huggingface_hub release.
# On failure, scripts/ci/hf_forward_triage.py opens one issue, or comments on the open issue
# with the same failure signature. Its triage report is uploaded as an artifact.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Triage and print the decision without creating or commenting on issues
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hf-forward
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
  KOHAKU_HUB_DB_BACKEND: postgres
  KOHAKU_HUB_DATABASE_URL: postgresql://hub_test:hub_test_password@127.0.0.1:25432/kohakuhub_test
  KOHAKU_HUB_S3_ENDPOINT: http://127.0.0.1:29001
  KOHAKU_HUB_S3_PUBLIC_ENDPOINT: http://127.0.0.1:29001
  KOHAKU_HUB_S3_ACCESS_KEY: minioadmin
  KOHAKU_HUB_S3_SECRET_KEY: minioadmin
  KOHAKU_HUB_S3_BUCKET: hub-storage
  KOHAKU_HUB_S3_REGION: us-east-1
  KOHAKU_HUB_LAKEFS_ENDPOINT: http://127.0.0.1:28000
  KOHAKU_HUB_LAKEFS_REPO_NAMESPACE: hf
  KOHAKU_HUB_LAKEFS_CREDENTIALS_FILE: ${{ github.workspace }}/hub-meta/test/backend-service/lakefs-credentials.env
  KOHAKU_HUB_CACHE_ENABLED: "true"
  KOHAKU_HUB_CACHE_URL: redis://127.0.0.1:26379/0
  KOHAKU_HUB_CACHE_TEST_URL: redis://127.0.0.1:26379/0
  COMPOSE_PROJECT_NAME: cheesecave-forward-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  latest-hf-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies and the latest HF client
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade huggingface_hub
          echo "HUB_VERSION=$(python -c 'import huggingface_hub; print(huggingface_hub.__version__)')" >> "$GITHUB_ENV"
      - name: Start isolated service stack
        run: docker compose -f scripts/ci/compose.yml up -d --wait --wait-timeout 180
      - name: Run tests that call huggingface_hub
        run: |
          mkdir -p lint-reports/ci
          python -m pytest test/kohakuhub -m hf_client -q --junitxml=lint-reports/ci/hf-forward.xml 2>&1 | tee lint-reports/ci/hf-forward.log
      - name: Triage a failure
        if: ${{ failure() }}
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          mkdir -p lint-reports/ci
          args=(--junit lint-reports/ci/hf-forward.xml --log lint-reports/ci/hf-forward.log
                --hub-version "$HUB_VERSION" --run-url "$RUN_URL")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python scripts/ci/hf_forward_triage.py "${args[@]}" | tee lint-reports/ci/hf-forward-triage.json
      - name: Collect infrastructure logs and remove temporary data
        if: ${{ always() }}
        run: |
          mkdir -p lint-reports/ci
          docker compose -f scripts/ci/compose.yml logs --no-color > lint-reports/ci/services.log 2>&1 || true
          docker compose -f scripts/ci/compose.yml down --volumes --remove-orphans
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() }}
        with:
          name: hf-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: lint-reports/ci/
          retention-days: 14
          if-no-files-found: warn
