# Ephemeral CI-only infrastructure. Never reuse production/dev volumes or credentials.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: hub_test
      POSTGRES_PASSWORD: hub_test_password
      POSTGRES_DB: kohakuhub_test
    ports: ["127.0.0.1:${CI_POSTGRES_PORT:-25432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_test -d kohakuhub_test"]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:${CI_MINIO_PORT:-29001}:9000"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
  lakefs:
    image: treeverse/lakefs:1.86.0
    depends_on:
      minio: {condition: service_healthy}
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_DATABASE_LOCAL_PATH: /home/lakefs/metadata.db
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minioadmin
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minioadmin
      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: 0123456789abcdef0123456789abcdef
      LAKEFS_LISTEN_ADDRESS: 0.0.0.0:8000
      LAKEFS_LOGGING_FORMAT: text
    ports: ["127.0.0.1:${CI_LAKEFS_PORT:-28000}:8000"]
    volumes: ["lakefs-data:/home/lakefs"]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8000/_health"]
      interval: 5s
      timeout: 5s
      retries: 30
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:${CI_VALKEY_PORT:-26379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  minio-data:
  lakefs-data:
