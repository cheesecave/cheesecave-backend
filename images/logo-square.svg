  <g id="tail" class="tail-rise" clip-path="url(#tail-occlusion)">
    <path class="tail-shape" fill="#f4aaa9" d="M407 224 C401 216 402 204 408 197 C414 190 424 190 431 196 C444 206 447 220 444 235 C442 250 437 262 435 275 C433 284 437 290 444 295 C432 293 426 284 429 272 L435 236 C438 225 436 216 430 209 C426 204 420 204 417 209 C415 213 418 219 422 222 Z"/>
  </g>
</svg>
