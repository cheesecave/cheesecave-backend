    <clipPath id="upper-pore"><ellipse cx="359.5" cy="273" rx="44.7" ry="31.7" transform="rotate(-17 359.5 273)"/></clipPath>
    <clipPath id="right-pore"><ellipse cx="433.8" cy="380.5" rx="35.8" ry="33.3" transform="rotate(-24 433.8 380.5)"/></clipPath>
    <clipPath id="left-pore"><ellipse cx="164.2" cy="303.4" rx="27.4" ry="20.2" transform="rotate(-17 164.2 303.4)"/></clipPath>
    <clipPath id="lower-pore"><ellipse cx="171.8" cy="433.5" rx="26.6" ry="27" transform="rotate(-14 171.8 433.5)"/></clipPath>
    <radialGradient id="cheek-pink"><stop stop-color="#efa7a5" stop-opacity=".48"/><stop offset="1" stop-color="#efa7a5" stop-opacity="0"/></radialGradient>
