           side rim stay behind the ears: joining them into this clip creates
           triangular cheese intrusions through the rising pink inner ears. -->
      <path d="M0 0 H534 V202 H442 C438 202 438 212 429 219 C413 231 377 236 340 235 C302 234 270 230 257 220 C250 215 248 202 244 202 H0 Z"/>
    </clipPath>
