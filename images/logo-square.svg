        <g clip-path="url(#lower-pore)"><path fill="#e07143" d="M141 403H203V465H141Z"/><ellipse fill="#ef8f3b" cx="179" cy="442" rx="27" ry="24" transform="rotate(-25 179 442)"/></g>
