<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>CheeseCave</title>
  <circle cx="256" cy="256" r="256" fill="#f7efe0" />
  <svg x="56" y="56" width="400" height="400" viewBox="0 0 534 534" fill="none" class="mouse-cheese-combined-svg" role="img" aria-label="CheeseCave">
  <title id="art-title">奶酪里探出头的小老鼠</title>
  <desc id="art-desc">透明背景，灰色小老鼠带着粉红耳朵和尾巴，从一块金黄色、带咬痕的奶酪中探出头。</desc>
