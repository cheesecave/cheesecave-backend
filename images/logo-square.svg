              <path d="M361 111 C369 107 381 107 388 111 C392 113 393 117 390 120 C388 122 385 121 382 119 C376 116 370 117 365 120 C362 122 358 120 358 117 C358 114 359 112 361 111 Z"/>
            </g>
          </g>
