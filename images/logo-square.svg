    <!-- The root emerges behind the front lip; the free end can drape to its right. -->
    <clipPath id="tail-occlusion"><path d="M0 0 H534 V534 H426 V221 C420 225 412 228 403 230 C380 236 360 236 340 235 H0 Z"/></clipPath>

    <path id="cheese-outline" d="M35 332 L51 318 C57 326 71 327 78 318 C90 323 99 311 96 301 C111 306 122 291 118 282 L111 270 L174 224 C186 230 199 241 203 228 C207 220 201 208 203 199 L276 155 C312 139 362 140 400 158 C435 172 473 195 487 217 C491 223 492 230 492 240 L492 264 C486 269 484 277 488 284 C478 289 477 308 486 316 C480 324 483 337 492 343 L495 409 C496 428 490 438 474 444 L79 520 C61 523 49 521 43 512 C39 507 38 497 38 487 C48 482 48 471 45 465 C58 459 57 444 47 436 C55 425 49 413 37 411 Z"/>
