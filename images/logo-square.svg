        </g>
        <path fill="#323232" d="M335 130 C335 123 340 119 345 120 C352 120 357 126 355 132 C354 137 350 141 348 144 L348 150 L340 151 L340 144 C336 139 334 136 335 130 Z"/>
        <g class="happy-expression" opacity="1">
          <g class="happy-eyes" fill="#323232">
            <path d="M300 107 C304 97 315 94 323 101 C328 105 331 109 332 113 C334 120 327 122 322 116 L315 110 C311 112 309 116 305 117 C299 118 297 113 300 107 Z"/>
            <path d="M360 109 C366 100 375 98 382 103 C387 106 390 111 391 115 C393 121 387 124 382 120 L375 114 C371 114 368 120 363 120 C357 120 356 115 360 109 Z"/>
          </g>
          <g class="happy-mouth">
            <path fill="#fff" d="M332 154 L356 154 C355 162 353 172 348 173 C345 174 343 171 342 171 C339 174 335 172 334 169 C332 165 332 159 332 154 Z"/>
            <path fill="#323232" d="M303 135 C306 132 313 140 321 143 C340 151 363 147 378 139 C385 135 385 141 381 145 C368 158 347 161 332 156 C319 153 308 147 304 142 C302 139 301 137 303 135 Z"/>
