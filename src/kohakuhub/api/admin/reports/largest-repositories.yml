id: largest-repositories
title: Largest repositories
category: Repositories
description: Repositories by bytes used.
heavy: false
dialects:
- postgresql
- sqlite
params:
- name: limit
  type: int
  default: 20
  description: How many rows
  min: 1
  max: 500
sql: |
  SELECT full_id, repo_type, namespace, used_bytes, private, created_at
  FROM repository
  ORDER BY used_bytes DESC
  LIMIT :limit
