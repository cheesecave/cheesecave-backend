id: space-used-by-namespace
title: Space used by namespace
category: Repositories
description: Namespaces by repositories and bytes used.
heavy: false
dialects:
- postgresql
- sqlite
params:
- name: limit
  type: int
  default: 20
  description: How many rows
  min: 1
  max: 500
sql: |
  SELECT namespace, COUNT(*) AS repositories, SUM(used_bytes) AS used_bytes
  FROM repository
  GROUP BY namespace
  ORDER BY used_bytes DESC
  LIMIT :limit
