id: lfs-objects-by-size
title: LFS objects by size
category: Storage and LFS
description: The largest LFS objects in the history.
heavy: true
dialects:
- postgresql
- sqlite
params:
- name: limit
  type: int
  default: 50
  description: How many rows
  min: 1
  max: 500
sql: |
  SELECT sha256, size, created_at
  FROM lfsobjecthistory
  ORDER BY size DESC
  LIMIT :limit
