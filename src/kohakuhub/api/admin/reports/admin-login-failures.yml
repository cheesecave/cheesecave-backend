id: admin-login-failures
title: Admin login failures
category: Security and site
description: Clients that failed the admin token and how long each waits.
heavy: false
dialects:
- postgresql
- sqlite
params:
- name: limit
  type: int
  default: 50
  description: How many rows
  min: 1
  max: 500
sql: |
  SELECT client_key, failures, last_failure, wait_until
  FROM admin_auth_client
  ORDER BY last_failure DESC
  LIMIT :limit
