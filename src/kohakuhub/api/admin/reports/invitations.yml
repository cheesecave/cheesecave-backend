id: invitations
title: Invitations
category: Accounts
description: Invitations and how much of each was used (the tokens are not shown).
heavy: false
dialects:
- postgresql
- sqlite
params:
- name: limit
  type: int
  default: 100
  description: How many rows
  min: 1
  max: 500
sql: |
  SELECT id, action, created_by_id, expires_at, max_usage, usage_count, used_at, created_at
  FROM invitation
  ORDER BY created_at DESC
  LIMIT :limit
