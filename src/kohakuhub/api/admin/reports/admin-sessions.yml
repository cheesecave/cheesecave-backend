id: admin-sessions
title: Admin sessions
category: Security and site
description: Sessions of the admin panel, the last used first (no secrets).
heavy: false
dialects:
- postgresql
- sqlite
params:
- name: limit
  type: int
  default: 50
  description: How many rows
  min: 1
  max: 500
sql: |
  SELECT principal_type, created_at, last_used_at, expires_at, revoked_at, ip
  FROM admin_session
  ORDER BY last_used_at DESC
  LIMIT :limit
